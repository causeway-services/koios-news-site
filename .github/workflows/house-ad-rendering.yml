name: House advertisement rendering
on:
  pull_request:
    paths:
      - 'src/render/house-ad-client.mjs'
      - 'test/house-ad-client.test.mjs'
      - '.github/workflows/house-ad-rendering.yml'
  push:
    branches: [main]
    paths:
      - 'src/render/house-ad-client.mjs'
      - 'test/house-ad-client.test.mjs'
      - '.github/workflows/house-ad-rendering.yml'
permissions:
  contents: read
jobs:
  ad-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check and exercise the exact emitted first-party ad script
        run: |
          node --check src/render/house-ad-client.mjs
          node --test test/house-ad-client.test.mjs
